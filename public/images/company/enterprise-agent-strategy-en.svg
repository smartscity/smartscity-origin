<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1490" viewBox="0 0 1440 1490" role="img" aria-labelledby="t d"><title id="t">Smartscity enterprise agent strategy tree r5</title><desc id="d">Enterprise agents are the root; shared capabilities support application branches. Reliability and quality sit within engineering. C1 C2 C3 are operating paths across domains.</desc><rect x="0" y="0" width="1440" height="1490" rx="16" fill="#f7f8f2" stroke="#e2e8df"/><text x="48" y="48" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#627c6b">SMARTSCITY / STRATEGY r5</text><text x="48" y="104" font-family="Georgia, Songti SC, serif" font-size="39" font-weight="400" fill="#203e36">From expertise to enterprise agents</text><text x="48" y="143" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#627568">Direction confirmed: agents at the top; reliability retained below. Detail under review.</text><rect x="300" y="190" width="840" height="140" rx="12" fill="#174e43" stroke="#174e43"/><text x="332" y="223" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="600" fill="#d1dfd3">S0  COMPANY DIRECTION · CONFIRMED</text><text x="332" y="268" font-family="Georgia, Songti SC, serif" font-size="36" font-weight="500" fill="#fffefa">Enterprise AI Agents</text><text x="332" y="304" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#e2ece0">Expertise that collaborates, executes and delivers verifiable outcomes</text><path d="M720 330V378M176 378H1264" fill="none" stroke="#9cb3a3" stroke-width="2"/><path d="M176 378V408" fill="none" stroke="#9cb3a3" stroke-width="2"/><rect x="48" y="408" width="256" height="123" rx="12" fill="#fffefa" stroke="#d8e2d8"/><text x="68" y="438" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#80978a">E1</text><text x="68" y="475" font-family="Arial, PingFang SC, sans-serif" font-size="21" font-weigh