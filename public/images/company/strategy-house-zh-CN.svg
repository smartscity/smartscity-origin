<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc">
<title id="title">Smartscity 公司战略屋</title>
<desc id="desc">屋顶为使命：让专家级可靠性工程贯穿软件全生命周期，通过 AI 实现规模化、持续化和自动化。横梁为面向全球企业的 AI 原生可靠性工程公司愿景。三根支柱分别为 C1 AI Reliability Engineering、C2 Independent Reliability Research and Assessment、C3 Reliability Engineering Products。共同方法和长期专业资产构成基础，支撑专业评估、专项工程服务、持续验证服务和工程软件交付。</desc>
