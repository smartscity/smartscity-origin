<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="t d"><title id="t">Governable expertise for enterprise agents</title><desc id="d">Expertise becomes a candidate method. Independent evaluation leads to adopt, revise or retain. Tasks bind adopted versions; feedback creates new candidates.</desc><rect x="0" y="0" width="1280" height="860" rx="16" fill="#f7f8f2" stroke="#e2e8df"/><text x="48" y="48" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="600" fill="#64796c">SMARTSCITY / GOVERNABLE EXPERTISE</text><text x="48" y="105" font-family="Georgia, Songti SC, serif" font-size="40" font-weight="400" fill="#203e36">A method earns its next version.</text><text x="48" y="145" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#64796c">Learning becomes operational capability through evidence and an explicit decision.</text><rect x="48" y="209" width="280" height="195" rx="12" fill="#fffefa" stroke="#d8e2d8"/><text x="72" y="246" font-family="Georgia, Songti SC, serif" font-size="23" font-weight="500" fill="#80988a">01</text><text x="72" y="291" font-family="Georgia, Songti SC, serif" font-size="26" font-weight="400" fill="#203e36">Expertise</text><text x="72" y="336" font-family="Arial, PingFang SC, sans-serif" font-size="17" font-weight="400" fill="#203e36">Sources &amp; constraints</text><text x="72" y="368" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#64796c">Examples &amp; counterexamples</text><rect x="392" y="209" width="356" height="195" rx="12" fill="#fffefa" stroke="#d8e2d8"/><text x="416" y="246" font-family="Georgia, Songti SC, serif" font-size="23" font-weight="500" fill="#80988a">02</text><text x="416" y="291" font-family="Georgia, Songti SC, serif" font-size="26" font-weight="400" fill="#203e36">Candidate method</text><text x="416" y="336" font-family="Arial, PingFang SC, sans-serif" font-size="17" font-weight="400" fill="#203e36">Procedure · criteria · version</text><text x="416" y="368" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#64796c">Applicable tasks &amp; unknown states</text><rect x="812" y="209" width="420" height="195" rx="12" fill="#fffefa" stroke="#d8e2d8"/><text x="836" y="246" font-family="Georgia, Songti SC, serif" font-size="23" font-weight="500" fill="#80988a">03</text><text x="836" y="291" font-family="Georgia, Songti SC, serif" font-size="26" font-weight="400" fill="#203e36">Independent evaluation</text><text x="836" y="336" font-family="Arial, PingFang SC, sans-serif" font-size="17" font-weight="400" fill="#203e36">Current vs. candidate</text><text x="836" y="368" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#64796c">Quality · omissions · total effort</text><path d="M328 305h64" fill="none" stroke="#174e43" stroke-width="2"/><path d="M384 299l8 6-8 6" fill="none" stroke="#174e43" stroke-width="2"/><path d="M748 305h64" fill="none" stroke="#174e43" stroke-width="2"/><path d="M804 299l8 6-8 6" fill="none" stroke="#174e43" stroke-width="2"/><path d="M1022 404V454" fill="none" stroke="#9cb3a3" stroke-width="2"/><rect x="812" y="454" width="420" height="100" rx="12" fill="#174e43" stroke="#174e43"/><text x="836" y="489" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#d1e1d3">ADOPTION DECISION</text><text x="836" y="526" font-family="Georgia, Songti SC, serif" font-size="24" font-weight="500" fill="#fffefa">Adopt · revise · retain current</text><path d="M812 504H570V404" fill="none" stroke="#a48d54" stroke-width="2" stroke-dasharray="6 5"/><text x="594" y="487" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#856c32">Revise</text><path d="M1022 554V609" fill="none" stroke="#9cb3a3" stroke-width="2"/><rect x="812" y="609" width="420" height="124" rx="12" fill="#fffefa" stroke="#d8e2d8"/><text x="836" y="647" font-family="Georgia, Songti SC, serif" font-size="25" font-weight="400" fill="#203e36">Version-bound tasks</text><text x="836" y="682" font-family="Arial, PingFang SC, sans-serif" font-size="17" font-weight="400" fill="#203e36">Use an explicit adopted method</text><text x="836" y="711" font-family="Arial, PingFang SC, sans-serif" font-size="15" font-weight="400" fill="#64796c">Retain the prior version for reversion</text><path d="M812 673H188V404" fill="none" stroke="#91aa9b" stroke-width="2"/><text x="333" y="656" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#526d5e">Task evidence → next candidate</text><text x="48" y="784" font-family="Georgia, Songti SC, serif" font-size="23" font-weight="400" fill="#203e36">Reverting a method does not undo completed business actions.</text><text x="48" y="824" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#64796c">Method governance design · A successful update in one task does not prove capability in every domain.</text></svg>