<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="t d"><title id="t">Enterprise agent teams that deliver outcomes</title><desc id="d">Define, assign, execute, verify and deliver. Verification can return work for revision; the customer owns acceptance.</desc><rect x="0" y="0" width="1280" height="760" rx="16" fill="#f7f8f2" stroke="#e2e8df"/><text x="48" y="48" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="600" fill="#64796c">SMARTSCITY / ENTERPRISE AGENTS</text><text x="48" y="105" font-family="Georgia, Songti SC, serif" font-size="40" font-weight="400" fill="#203e36">Organize work around the outcome.</text><text x="48" y="145" font-family="Arial, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#64796c">Clear responsibilities. Inspectable execution. Independent acceptance.</text><rect x="48" y="220" width="224" height="220" rx="12" fill="#fffefa" stroke="#d8e2d8"/><text x="68" y="258" font-family="Georgia, Songti SC, serif" font-size="23" font-weight="500" fill="#64796c">01</text><text x="68" y="307" font-family="Georgia, Songti SC, serif" font-size="27" font-weight="500" fill="#203e36">Define</text><text x="68" y="352" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#64796c">Goal &amp; scope</text><text x="68" y="386" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#64796c">Acceptance criteria</text><path d="M272 322h16" fill="none" stroke="#174e43" stroke-width="2"/><path d="M282 317l6 5-6 5" fill="none" stroke="#174e43" stroke-width="2"/><rect x="288" y="220" width="224" height="220" rx="12" fill="#fffefa" stroke="#d8e2d8"/><text x="308" y="258" font-family="Georgia, Songti SC, serif" font-size="23" font-weight="500" fill="#64796c">02</text><text x="308" y="307" font-family="Georgia, Songti SC, serif" font-size="27" font-weight="500" fill="#203e36">Assign</text><text x="308" y="352" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#64796c">Roles &amp; dependencies</text><text x="308" y="386" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#64796c">Handoff conditions</text><path d="M512 322h16" fill="none" stroke="#174e43" stroke-width="2"/><path d="M522 317l6 5-6 5" fill="none" stroke="#174e43" stroke-width="2"/><rect x="528" y="220" width="224" height="220" rx="12" fill="#fffefa" stroke="#d8e2d8"/><text x="548" y="258" font-family="Georgia, Songti SC, serif" font-size="23" font-weight="500" fill="#64796c">03</text><text x="548" y="307" font-family="Georgia, Songti SC, serif" font-size="27" font-weight="500" fill="#203e36">Execute</text><text x="548" y="352" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#64796c">Authorized tools</text><text x="548" y="386" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#64796c">Actual results</text><path d="M752 322h16" fill="none" stroke="#174e43" stroke-width="2"/><path d="M762 317l6 5-6 5" fill="none" stroke="#174e43" stroke-width="2"/><rect x="768" y="220" width="224" height="220" rx="12" fill="#174e43" stroke="#174e43"/><text x="788" y="258" font-family="Georgia, Songti SC, serif" font-size="23" font-weight="500" fill="#d3e4d6">04</text><text x="788" y="307" font-family="Georgia, Songti SC, serif" font-size="27" font-weight="500" fill="#fffefa">Verify</text><text x="788" y="352" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#d3e4d6">Independent checks</text><text x="788" y="386" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#d3e4d6">Evidence &amp; gaps</text><path d="M992 322h16" fill="none" stroke="#174e43" stroke-width="2"/><path d="M1002 317l6 5-6 5" fill="none" stroke="#174e43" stroke-width="2"/><rect x="1008" y="220" width="224" height="220" rx="12" fill="#fffefa" stroke="#d8e2d8"/><text x="1028" y="258" font-family="Georgia, Songti SC, serif" font-size="23" font-weight="500" fill="#64796c">05</text><text x="1028" y="307" font-family="Georgia, Songti SC, serif" font-size="27" font-weight="500" fill="#203e36">Deliver</text><text x="1028" y="352" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#64796c">Usable artifacts</text><text x="1028" y="386" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#64796c">Customer acceptance</text><path d="M880 440V479H640V440" fill="none" stroke="#a48d54" stroke-width="2"/><text x="674" y="506" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#856c32">Revise when criteria are not met</text><rect x="48" y="549" width="1184" height="80" rx="12" fill="#eaf0e6" stroke="#d8e2d8"/><text x="72" y="578" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="600" fill="#526d5e">EVIDENCE TRAVELS WITH THE WORK</text><text x="72" y="608" font-family="Arial, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#203e36">Inputs &amp; versions  →  actions &amp; state  →  check results  →  accepted deliverables</text><text x="48" y="684" font-family="Georgia, Songti SC, serif" font-size="22" font-weight="400" fill="#203e36">People retain business decisions and delivery accountability.</text><text x="48" y="718" font-family="Arial, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#64796c">Method design · Roles can be combined for small tasks; role count is not a quality measure.</text></svg>