<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">How an agent tests a retry hypothesis</title><desc id="desc">A retry hypothesis branches into configuration, execution and business evidence. Each supports a different conclusion; none substitutes for another.</desc><rect x="0" y="0" width="1200" height="800" rx="18" fill="#f6f7f1" stroke="#e0e6de"/><text x="48" y="48" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">SMARTSCITY / EVIDENCE-DRIVEN INVESTIGATION</text><text x="48" y="102" fill="#1d3432" font-family="Georgia" font-size="38" font-weight="400">One signal. Three questions to resolve.</text><text x="48" y="141" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Downstream calls rise while incoming business traffic stays steady.</text><rect x="48" y="181" width="1104" height="76" rx="10" fill="#174e43" stroke="#174e43"/><text x="72" y="213" fill="#d5e4d7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">KEEP ALTERNATIVE EXPLANATIONS OPEN</text><text x="72" y="239" fill="#fffefa" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Retries   /   Changed fan-out   /   Backlog release   /   Metric definition changes</text><path d="M224 257L224 290" fill="none" stroke="#b2c2b7" stroke-width="2"/><rect x="48" y="290" width="352" height="304" rx="10" fill="#fffefa" stroke="#dce3de"/><text x="72" y="330" fill="#879b8f" font-family="Georgia" font-size="28" font-weight="400">01</text><text x="72" y="370" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Could retries compound?</text><text x="72" y="402" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">CONFIGURATION EVIDENCE</text><circle cx="77" cy="435" r="3" fill="#879b8f"/><text x="92" y="440" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Versioned policies</text><circle cx="77" cy="467" r="3" fill="#879b8f"/><text x="92" y="472" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Call boundaries</text><circle cx="77" cy="499" r="3" fill="#879b8f"/><text x="92" y="504" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Timeouts &amp; cancellation</text><path d="M72 526L376 526" fill="none" stroke="#dce3de" stroke-width="2"/><text x="72" y="561" fill="#174e43" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Supports a risk hypothesis</text><path d="M600 257L600 290" fill="none" stroke="#b2c2b7" stroke-width="2"/><rect x="424" y="290" width="352" height="304" rx="10" fill="#fffefa" stroke="#dce3de"/><text x="448" y="330" fill="#879b8f" font-family="Georgia" font-size="28" font-weight="400">02</text><text x="448" y="370" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Did attempts multiply?</text><text x="448" y="402" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">EXECUTION EVIDENCE</text><circle cx="453" cy="435" r="3" fill="#879b8f"/><text x="468" y="440" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Operation IDs &amp; attempts</text><circle cx="453" cy="467" r="3" fill="#879b8f"/><text x="468" y="472" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Traces &amp; request logs</text><circle cx="453" cy="499" r="3" fill="#879b8f"/><text x="468" y="504" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Controlled failure records</text><path d="M448 526L752 526" fill="none" stroke="#dce3de" stroke-width="2"/><text x="448" y="561" fill="#174e43" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Supports observed behavior</text><path d="M976 257L976 290" fill="none" stroke="#b2c2b7" stroke-width="2"/><rect x="800" y="290" width="352" height="304" rx="10" fill="#fffefa" stroke="#dce3de"/><text x="824" y="330" fill="#879b8f" font-family="Georgia" font-size="28" font-weight="400">03</text><text x="824" y="370" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Did outcomes repeat?</text><text x="824" y="402" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">BUSINESS EVIDENCE</text><circle cx="829" cy="435" r="3" fill="#879b8f"/><text x="844" y="440" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Authoritative records</text><circle cx="829" cy="467" r="3" fill="#879b8f"/><text x="844" y="472" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">State transitions</text><circle cx="829" cy="499" r="3" fill="#879b8f"/><text x="844" y="504" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Idempotency checks</text><path d="M824 526L1128 526" fill="none" stroke="#dce3de" stroke-width="2"/><text x="824" y="561" fill="#174e43" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Supports business impact</text><rect x="48" y="624" width="1104" height="116" rx="10" fill="#ecefe5" stroke="#dce3de"/><text x="72" y="656" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">THE FINDING</text><text x="72" y="692" fill="#1d3432" font-family="Georgia" font-size="22" font-weight="400">Constraint → observation → mechanism → impact → remediation → acceptance</text><text x="72" y="719" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Experts confirm business meaning and causal sufficiency. Missing evidence stays explicit.</text></svg>