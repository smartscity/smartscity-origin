<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">From system evidence to engineering decisions</title><desc id="desc">Sources feed agent analysis. Experts review scope, experiments and conclusions. Outputs include a report, evidence and verification criteria.</desc><rect x="0" y="0" width="1200" height="730" rx="18" fill="#f6f7f1" stroke="#e0e6de"/><text x="48" y="48" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">SMARTSCITY / AI AGENT RELIABILITY</text><text x="48" y="102" fill="#1d3432" font-family="Georgia" font-size="36" font-weight="400">From system evidence to engineering decisions</text><text x="48" y="140" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">A structured assessment, connected to your existing engineering tools.</text><rect x="48" y="190" width="280" height="390" rx="10" fill="#fffefa" stroke="#dce3de"/><rect x="388" y="190" width="390" height="390" rx="10" fill="#fffefa" stroke="#dce3de"/><rect x="838" y="190" width="314" height="390" rx="10" fill="#fffefa" stroke="#dce3de"/><text x="70" y="229" fill="#879b8f" font-family="Georgia" font-size="25" font-weight="400">01</text><text x="114" y="229" fill="#174e43" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">CONNECT</text><text x="410" y="229" fill="#879b8f" font-family="Georgia" font-size="25" font-weight="400">02</text><text x="454" y="229" fill="#174e43" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">ANALYZE &amp; VERIFY</text><text x="860" y="229" fill="#879b8f" font-family="Georgia" font-size="25" font-weight="400">03</text><text x="904" y="229" fill="#174e43" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">DELIVER</text><text x="70" y="282" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Architecture &amp; intent</text><text x="70" y="310" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Business goals · dependencies</text><path d="M70 330L306 330" fill="none" stroke="#e3e8e0" stroke-width="2"/><text x="70" y="378" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Code &amp; configuration</text><text x="70" y="406" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Versions · policies · changes</text><path d="M70 426L306 426" fill="none" stroke="#e3e8e0" stroke-width="2"/><text x="70" y="474" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Runtime &amp; business state</text><text x="70" y="502" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Metrics · traces · records</text><circle cx="424" cy="273" r="13" fill="#edf3eb"/><text x="420" y="278" fill="#174e43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">1</text><text x="450" y="278" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Align context</text><text x="450" y="302" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Match scope, versions and time windows</text><circle cx="424" cy="347" r="13" fill="#edf3eb"/><text x="420" y="352" fill="#174e43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">2</text><text x="450" y="352" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Test explanations</text><text x="450" y="376" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Compare constraints and competing causes</text><circle cx="424" cy="421" r="13" fill="#edf3eb"/><text x="420" y="426" fill="#174e43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">3</text><text x="450" y="426" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Execute checks</text><text x="450" y="450" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Query tools and run approved validations</text><circle cx="424" cy="495" r="13" fill="#edf3eb"/><text x="420" y="500" fill="#174e43" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">4</text><text x="450" y="500" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Bind evidence</text><text x="450" y="524" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Connect every finding to its support</text><text x="860" y="282" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Assessment overview</text><text x="860" y="310" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Coverage · priorities · risk profile</text><path d="M860 330L1130 330" fill="none" stroke="#e3e8e0" stroke-width="2"/><text x="860" y="378" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Detailed findings</text><text x="860" y="406" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Mechanism · impact · evidence</text><path d="M860 426L1130 426" fill="none" stroke="#e3e8e0" stroke-width="2"/><text x="860" y="474" fill="#1d3432" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Remediation criteria</text><text x="860" y="502" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Options · ownership · verification</text><path d="M336 380L378 380" fill="none" stroke="#174e43" stroke-width="2"/><path d="M370 374l8 6-8 6" fill="none" stroke="#174e43" stroke-width="2"/><path d="M786 380L828 380" fill="none" stroke="#174e43" stroke-width="2"/><path d="M820 374l8 6-8 6" fill="none" stroke="#174e43" stroke-width="2"/><rect x="388" y="608" width="764" height="68" rx="10" fill="#174e43" stroke="#174e43"/><text x="412" y="635" fill="#d5e4d7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">EXPERT REVIEW</text><text x="412" y="660" fill="#fffefa" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Business meaning · experiment scope · conclusions · trade-offs</text><path d="M584 580L584 608" fill="none" stroke="#b2c2b7" stroke-width="2"/><text x="48" y="644" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">METHOD VIEW</text><text x="48" y="670" fill="#566762" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Tooling depends on the agreed scope.</text></svg>